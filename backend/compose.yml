# To enter db: 
# sudo docker exec -it ppipe_db psql -U postgres
# sudo docker exec -it ppipe_test_db psql -U postgres -d test_db

# To run containers:
# docker compose -f compose.yml up -d db    # start (detached / background)
# docker compose -f compose.yml stop db     # stop, keep the container + data


# To list db running:
# docker ps -a

# TODO: Probably wanna change:
  # - USER
  # - PASSWORD
  # PORTS?
  # POSTGRES_DB for "prod"


services:
  db:
    container_name: ppipe_db
    image: postgres:12
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  test_db:
    container_name: ppipe_test_db
    image: postgres:12
    ports:
      - "5434:5433"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    volumes:
      - pgtestdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
  pgtestdata: {}
